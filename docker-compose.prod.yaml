services:
  xlwings-server:
    build: .
    command: >
       sh -c '
         exec uvicorn \
           --host 0.0.0.0 \
           --port 8000 \
           --workers 1 \
           --proxy-headers \
           --forwarded-allow-ips="*" \
           --access-log \
           xlwings_server.main:main_app
       '
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: "unless-stopped"

